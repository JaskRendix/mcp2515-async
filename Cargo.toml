[package]
name = "mcp2515-async"
version = "0.1.0"
edition = "2024"
authors = ["Giorgio"]
description = "Async no_std MCP2515 CAN controller driver for embedded-hal-async and Embassy"
license = "MIT"

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
heapless = "0.9"
defmt = { version = "1.1", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
defmt = ["dep:defmt", "embassy-sync/defmt", "embassy-time/defmt"]